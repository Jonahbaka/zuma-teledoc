# =============================================================================
# DoctaRx Nigeria — production nginx site config
# Place at: /etc/nginx/conf.d/doctarx.conf  (or sites-available + symlink)
# Reload:   sudo nginx -t && sudo systemctl reload nginx
# -----------------------------------------------------------------------------
# The Node app (server/index.js, started by PM2) listens on 127.0.0.1:3000 and
# serves BOTH the Next.js app and the Socket.IO endpoint. The /socket.io/ block
# below is the critical piece: without the Upgrade/Connection headers the
# WebSocket handshake silently downgrades to long-polling and realtime breaks.
#
# Single upstream because the web app runs single-instance (see ecosystem.config.js:
# Socket.IO room/presence state is in-process and not cluster-safe). If you later
# add @socket.io/redis-adapter and scale to multiple instances/hosts, switch the
# upstream to several servers and add `ip_hash;` for sticky sessions.
# =============================================================================

upstream doctarx_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name doctarx.com www.doctarx.com;

    # Allow ACME/Let's Encrypt challenges to pass through.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doctarx.com www.doctarx.com;

    # TLS — adjust paths to your certbot/ACM-managed certs.
    ssl_certificate     /etc/letsencrypt/live/doctarx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doctarx.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nigerian mobile clients: keep headers generous, allow large uploads
    # (scanned records, lab results, imaging attachments on referrals).
    client_max_body_size 50m;
    large_client_header_buffers 4 32k;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Socket.IO / WebSocket signaling (realtime + WebRTC signaling) ─────────
    location /socket.io/ {
        proxy_pass http://doctarx_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Long-lived signaling sockets — don't time out mid-consultation.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ── Health checks (fast path, no buffering) ──────────────────────────────
    location = /health  { proxy_pass http://doctarx_app; proxy_set_header Host $host; access_log off; }
    location = /readyz  { proxy_pass http://doctarx_app; proxy_set_header Host $host; access_log off; }
    location = /api/health { proxy_pass http://doctarx_app; proxy_set_header Host $host; access_log off; }

    # ── Everything else (Next.js app + API) ──────────────────────────────────
    location / {
        proxy_pass http://doctarx_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
    }
}
