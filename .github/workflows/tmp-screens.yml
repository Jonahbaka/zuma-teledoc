# TEMPORARY: capture screenshots of the microsite + platform on a CI runner
# (the dev sandbox cannot install a browser). Pushes PNGs back to this branch.
# Feature-branch only — never main, cannot deploy. Removed after delivery.
name: tmp-screens

on:
  push:
    branches: [claude/blissful-lamport-514ka6]
    paths:
      - '.screenshots/**'
      - '.github/workflows/tmp-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blissful-lamport-514ka6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Build & start the platform (best effort)
        run: |
          npm ci
          npm run build
          (npx next start -p 3100 > /tmp/next.log 2>&1 &) || true
          # wait for the server to answer (up to ~40s)
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/ng; then echo "next up"; break; fi
            sleep 1
          done
        continue-on-error: true

      - name: Capture screenshots
        run: node .screenshots/shoot.mjs

      - name: Commit screenshots back to the branch
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add .screenshots/out
          git commit -m "tmp: CI screenshots of microsite + platform [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude/blissful-lamport-514ka6
