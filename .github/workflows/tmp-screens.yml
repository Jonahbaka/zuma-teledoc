# TEMPORARY: fast microsite screenshots on a CI runner (dev sandbox has no browser).
# Pushes PNGs back to this branch. Feature-branch only; never main; cannot deploy.
name: tmp-screens

on:
  push:
    branches: [claude/blissful-lamport-514ka6]
    paths:
      - '.screenshots/shoot-microsite.mjs'
      - '.github/workflows/tmp-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-screens
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blissful-lamport-514ka6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium (no system deps — runner already has them)
        run: |
          npm i -D playwright@1.49.1
          npx playwright install chromium

      - name: Capture microsite screenshots
        run: node .screenshots/shoot-microsite.mjs

      - name: Commit screenshots back to the branch
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull --rebase origin claude/blissful-lamport-514ka6 || true
          git add .screenshots/out
          git commit -m "tmp: microsite screenshots [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude/blissful-lamport-514ka6
