# TEMPORARY: fast microsite screenshots on a CI runner (dev sandbox has no browser).
# Pushes PNGs back to this branch (and uploads them as an artifact). Feature-branch only.
name: tmp-screens

on:
  push:
    branches: [claude/blissful-lamport-514ka6]
    paths:
      - '.screenshots/shoot-microsite.mjs'
      - '.github/workflows/tmp-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-screens
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blissful-lamport-514ka6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright in an isolated dir (avoids the full project install)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install chromium

      - name: Capture microsite screenshots
        run: NODE_PATH=/tmp/pw/node_modules node .screenshots/shoot-microsite.mjs

      - name: Upload screenshots artifact (backup retrieval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microsite-screenshots
          path: .screenshots/out/*.png
          if-no-files-found: warn

      - name: Commit screenshots back to the branch (force — path is gitignored)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f .screenshots/out
          git commit -m "tmp: microsite screenshots [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude/blissful-lamport-514ka6
