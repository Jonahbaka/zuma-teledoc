name: Neon DB Verify (NG clinical)

# Proves the Nigeria clinical database deployment from CI using the DATABASE_URL
# secret (the runner can reach Neon even though it is IP-restricted from other
# environments). The default path is READ-ONLY: it verifies the migration is
# recorded, the required clinical tables exist, and the documented persisted
# records from the live simulation are present — without mutating production.
#
# A fresh, mutating live clinical simulation (21 scenarios, new persisted IDs)
# can be run on demand via workflow_dispatch with run_live_sim=true.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_sim:
        description: 'Also run the mutating live clinical simulation against the DB'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  neon-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Neon schema + persisted records (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot verify Neon from CI."
            exit 1
          fi
          node .github/scripts/verify_neon.js

      - name: Live clinical simulation (mutating, on demand only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_sim }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_DATABASE_URL_SIMULATION: 'true'
          ALLOW_PRODUCTION_SIMULATION: 'true'
          SIMULATION_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/ng-simulations
        run: |
          echo "Running live clinical simulation (21 scenarios) against the deployed DB…"
          npm run ng:simulate:clinical

      - name: Upload simulation evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_live_sim }}
        uses: actions/upload-artifact@v4
        with:
          name: ng-clinical-simulation-evidence
          path: artifacts/ng-simulations/**
          if-no-files-found: warn
