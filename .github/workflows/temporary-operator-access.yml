name: Temporary DoctaRx Operator Access

on:
  push:
    branches:
      - codex/deploy-nestora-nursing
    paths:
      - .github/workflows/temporary-operator-access.yml

permissions:
  contents: read

concurrency:
  group: doctarx-temporary-operator-access
  cancel-in-progress: true

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure documented AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2

      - name: Open a five-minute operator window
        env:
          EXPECTED_PUBLIC_IP: 18.217.97.145
          OPERATOR_CIDR: 102.91.77.72/32
        run: |
          set -Eeuo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters \
              "Name=ip-address,Values=$EXPECTED_PUBLIC_IP" \
              'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"
          GROUP_ID="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' \
            --output text)"

          revoke_access() {
            set +e
            aws ec2 revoke-security-group-ingress \
              --group-id "$GROUP_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$OPERATOR_CIDR}]" \
              >/dev/null 2>&1 || true
            echo 'Temporary operator SSH access was revoked.'
          }
          trap revoke_access EXIT

          aws ec2 authorize-security-group-ingress \
            --group-id "$GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$OPERATOR_CIDR,Description=CodexAuxDeploy${GITHUB_RUN_ID}}]" \
            >/dev/null
          echo "Temporary operator access is open for $OPERATOR_CIDR."
          sleep 300
