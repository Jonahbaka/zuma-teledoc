name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression tests (production-defect guards)
        run: npm run test:regression

      - name: Portal contract tests (route/portal correctness, 404 + country separation)
        run: npm run test:portal

      - name: Workflow state-machine simulations
        run: npm run test:sim
