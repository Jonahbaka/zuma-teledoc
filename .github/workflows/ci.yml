name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --allowJs --checkJs false --project jsconfig.json

      - name: Functional, regression, and portal tests
        run: npm test

      - name: Deployment and secret guards
        run: npm run test:deploy-guard

      - name: Workflow state-machine simulations
        run: npm run test:sim

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Browser PWA, mobile, and accessibility gate
        run: npm run e2e:pwa-accessibility

      - name: Two-party browser video and in-call chat gate
        run: npm run e2e:video:ng

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
