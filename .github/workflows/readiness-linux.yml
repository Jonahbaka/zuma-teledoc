name: Production readiness validation (no deployment)

on:
  push:
    branches: [codex/latest-work-readiness-20261104, codex/doctarx-copy-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-sfu-media:
    if: contains(fromJSON('["iamjonahbaka-create/Jonah-doctarx","Jonahbaka/zuma-teledoc"]'), github.repository) && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MEDIAPIPE_SKIP_MODEL_DOWNLOAD: '1'
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: fictional-local-key
      LIVEKIT_API_SECRET: fictional-local-test-secret-longer-than-32-characters
      REQUIRE_LIVEKIT_E2E: 'true'
      LIVEKIT_E2E_COUNTS: '3,5,10'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real local SFU media, controls and leave with fictional input
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          curl --fail --location --retry 3 --max-time 120 https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz -o "$fixture_dir/livekit.tar.gz"
          echo "1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb  $fixture_dir/livekit.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/livekit.tar.gz" -C "$fixture_dir"
          cat > "$fixture_dir/local.yaml" <<'YAML'
          port: 7880
          bind_addresses: [127.0.0.1]
          rtc:
            tcp_port: 7881
            udp_port: 7882
            node_ip: 127.0.0.1
            enable_loopback_candidate: true
          keys:
            fictional-local-key: fictional-local-test-secret-longer-than-32-characters
          logging:
            level: error
          YAML
          "$fixture_dir/livekit-server" --config "$fixture_dir/local.yaml" > "$fixture_dir/server.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:7880 >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:7880 >/dev/null
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/e2e-livekit-sfu.cjs
      - name: Record media evidence
        if: always()
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const root = 'artifacts/livekit-sfu-e2e';
          if (!fs.existsSync(root)) process.exit(0);
          for (const name of fs.readdirSync(root)) {
            const result = JSON.parse(fs.readFileSync(root + '/' + name + '/result.json'));
            console.log(JSON.stringify({ sourceSha: result.sourceSha, result: result.finalResult, boundary: result.boundary,
              scenarios: result.scenarios.map(s => ({ count: s.count, status: s.status, receivingParticipants: s.mediaProgress.length,
                controls: s.controls, cleanLeave: s.cleanLeave, turnRelayObserved: s.turnRelayObserved, error: s.error })) }));
          }
          JS
  production-build:
    if: contains(fromJSON('["iamjonahbaka-create/Jonah-doctarx","Jonahbaka/zuma-teledoc"]'), github.repository) && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MEDIAPIPE_SKIP_MODEL_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit --allowJs --checkJs false --project jsconfig.json
      - run: npm run build
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
  linux-security-and-release:
    # Standard public-repository runner; no larger runner or cloud credentials.
    if: contains(fromJSON('["iamjonahbaka-create/Jonah-doctarx","Jonahbaka/zuma-teledoc"]'), github.repository) && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: doctarx_test
          POSTGRES_PASSWORD: fictional-local-test-password
          POSTGRES_DB: doctarx_readiness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctarx_test -d doctarx_readiness_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://doctarx_test:fictional-local-test-password@127.0.0.1:5432/doctarx_readiness_test
      SIMULATION_DATABASE_URL: postgresql://doctarx_test:fictional-local-test-password@127.0.0.1:5432/doctarx_readiness_test
      DOCTARX_VOICE_DB_TEST: 'true'
      ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      JWT_ACCESS_SECRET: fictional-readiness-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: fictional-readiness-refresh-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
      MEDIAPIPE_SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install exact dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate disposable PostgreSQL
        id: database
        run: |
          npm run migrate
          npm run ng:migrate
          node scripts/prepare-readiness-database.cjs
      - name: Complete Linux functional, release and PostgreSQL gate
        run: node scripts/verify-readiness.cjs
      - name: Install Chromium for voice lifecycle tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile voice lifecycle and accessibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database.outcome == 'success' }}
        run: npx playwright test -c playwright.voice.config.cjs
      - name: Record verification boundary
        if: always()
        run: |
          printf 'Commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Disposable Linux/PostgreSQL fixtures only. No production secrets, deployment, patient audio, or clinical activation.' >> "$GITHUB_STEP_SUMMARY"
