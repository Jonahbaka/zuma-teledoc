name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the deploy status parser)
        uses: actions/checkout@v4

      - name: Trigger deploy webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          NG_LIVEKIT_URL: ${{ secrets.NG_LIVEKIT_URL }}
          NG_LIVEKIT_API_KEY: ${{ secrets.NG_LIVEKIT_API_KEY }}
          NG_LIVEKIT_API_SECRET: ${{ secrets.NG_LIVEKIT_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RTC_TURN_URLS: ${{ secrets.RTC_TURN_URLS }}
          TURN_STATIC_AUTH_SECRET: ${{ secrets.TURN_STATIC_AUTH_SECRET }}
        run: |
          auth_header=()

          if [ -n "$DEPLOY_SECRET" ]; then
            auth_header=(-H "x-deploy-token: $DEPLOY_SECRET")
          else
            oidc_response=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=doctarx-deploy")
            oidc_token=$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))')
            if [ -z "$oidc_token" ]; then
              echo "::error::Unable to obtain GitHub OIDC deploy token."
              exit 1
            fi
            auth_header=(-H "Authorization: Bearer $oidc_token")
          fi

          # Build env payload via Python — values read from process env, never
          # appear as shell arguments, and GitHub Actions masks them in logs.
          # Keys absent from GitHub Secrets are empty strings and are skipped.
          deploy_body=$(python3 -c 'import json,os; keys=["NG_LIVEKIT_URL","NG_LIVEKIT_API_KEY","NG_LIVEKIT_API_SECRET","DATABASE_URL","JWT_ACCESS_SECRET","JWT_REFRESH_SECRET","ENCRYPTION_KEY","SESSION_SECRET","ANTHROPIC_API_KEY","GEMINI_API_KEY","CLAUDE_API_KEY","STRIPE_SECRET_KEY","STRIPE_PUBLISHABLE_KEY","STRIPE_WEBHOOK_SECRET","PAYSTACK_SECRET_KEY","PAYSTACK_PUBLIC_KEY","FLUTTERWAVE_SECRET_KEY","FLUTTERWAVE_PUBLIC_KEY","TERMII_API_KEY","SMTP_HOST","SMTP_USER","SMTP_PASSWORD","SMTP_FROM","RTC_TURN_URLS","TURN_STATIC_AUTH_SECRET"]; print(json.dumps({"env": {k: os.environ[k] for k in keys if os.environ.get(k)}}))')

          response=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
            -X POST https://doctarx.com/api/deploy \
            -H "Content-Type: application/json" \
            "${auth_header[@]}" \
            --data "$deploy_body" \
            --max-time 30)
          cat /tmp/deploy_response.json
          if [ "$response" != "200" ]; then
            echo "Deploy webhook returned HTTP $response"
            exit 1
          fi
          deploy_success=$(python3 -c 'import json,sys; print("true" if json.load(open("/tmp/deploy_response.json")).get("success") is True else "false")')
          if [ "$deploy_success" != "true" ]; then
            already=$(python3 -c 'import json,sys; d=json.load(open("/tmp/deploy_response.json")); print("true" if "already in progress" in d.get("message","") else "false")')
            if [ "$already" = "true" ]; then
              echo "Deploy already in progress on EC2 — will poll for completion"
            else
              echo "::error::Deploy webhook did not start a deployment."
              exit 1
            fi
          else
            echo "Deploy triggered successfully - build running in background on server"
          fi

      - name: Wait for deploy and verify NG platform
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          # Poll the EC2 deploy status contract until it reaches a TERMINAL state.
          # The poller and the server agree on ONE JSON shape (parsed by
          # .github/scripts/deploy_status.py). The job succeeds ONLY when the
          # server reports status=success AND verified=true. failed / timeout /
          # unknown are hard failures; an unparseable contract is a hard failure;
          # a slow or detached build is never reported to GitHub as success.
          set -o pipefail
          echo "Polling /api/deploy/log until terminal state (max 40 min)..."
          DEADLINE=$(( $(date +%s) + 2400 ))
          OUTCOME=timeout
          LAST_VERIFY=""
          EXPECTED_SHA="${GITHUB_SHA:0:12}"

          # Bootstrap fallback: when the live server is too old to expose
          # /api/deploy/log, confirm the deploy via version-independent public
          # endpoints. Success requires the exact target commit to be live AND
          # the app healthy AND the NG platform reporting status=ok. Sets
          # BOOT_GC / BOOT_HS / BOOT_NG / BOOT_MR for reporting; returns 0 on a
          # fully verified bootstrap completion.
          bootstrap_check() {
            local H
            BOOT_GC=""; BOOT_HS=""; BOOT_NG=""; BOOT_MR=""
            H="$(curl -s --max-time 20 https://doctarx.com/api/health 2>/dev/null || true)"
            BOOT_GC="$(printf '%s' "$H" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print((d.get("gitCommit") or "")[:12])' 2>/dev/null || true)"
            BOOT_HS="$(printf '%s' "$H" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("status",""))' 2>/dev/null || true)"
            BOOT_NG="$(curl -s --max-time 20 https://doctarx.com/api/ng/health 2>/dev/null || true)"
            BOOT_MR="$(curl -s --max-time 20 https://doctarx.com/api/ng/conference/media-readiness 2>/dev/null || true)"
            [ -n "$BOOT_GC" ] && [ "${BOOT_GC:0:7}" = "${EXPECTED_SHA:0:7}" ] \
              && { [ "$BOOT_HS" = "healthy" ] || [ "$BOOT_HS" = "ready" ]; } \
              && printf '%s' "$BOOT_NG" | grep -q '"status":"ok"'
          }

          fetch_status() {
            if [ -n "$DEPLOY_SECRET" ]; then
              curl -s --max-time 20 -H "x-deploy-token: $DEPLOY_SECRET" "https://doctarx.com/api/deploy/log?lines=400" 2>/dev/null || true
            else
              oidc_resp=$(curl -sS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=doctarx-deploy" 2>/dev/null || echo '{}')
              oidc_tok=$(printf '%s' "$oidc_resp" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("value",""))' 2>/dev/null || echo '')
              curl -s --max-time 20 -H "Authorization: Bearer $oidc_tok" "https://doctarx.com/api/deploy/log?lines=400" 2>/dev/null || true
            fi
          }

          while [ $(date +%s) -lt $DEADLINE ]; do
            RESP="$(fetch_status || true)"
            PARSED="$(printf '%s' "$RESP" | python3 .github/scripts/deploy_status.py || true)"
            KV="$(printf '%s\n' "$PARSED" | sed '/^---VERIFY---$/,$d')"
            LAST_VERIFY="$(printf '%s\n' "$PARSED" | sed -n '/^---VERIFY---$/,$p' | tail -n +2)"

            RESULT=""; STATUS=""; VERIFIED=""; DEPLOYID=""; PID=""; EXITCODE=""; COMMIT=""
            CHECK_BUILD=""; CHECK_PM2=""; CHECK_HEALTH=""; CHECK_NGHEALTH=""
            eval "$KV"

            if [ "$RESULT" = "contract_error" ]; then
              echo "::error::DEPLOY_STATUS_CONTRACT_ERROR — /api/deploy/log did not honor the status contract."
              echo "----- raw (redacted) response, truncated to 2000 chars -----"
              printf '%s' "$RESP" | head -c 2000
              echo ""
              OUTCOME=contract_error
              break
            fi

            if [ "$RESULT" = "transient" ]; then
              echo "$(date -u +%H:%M:%S) status endpoint unreachable/non-JSON (server may be mid-reload) — retrying…"
              sleep 20
              continue
            fi

            if [ "$RESULT" = "route_missing" ]; then
              # Old server without /api/deploy/log — confirm via /api/health.
              if bootstrap_check; then
                OUTCOME=success
                echo "=== BOOTSTRAP DEPLOY COMPLETE — target commit is live and verified ==="
                echo "gitCommit=$BOOT_GC (expected ${EXPECTED_SHA:0:7}) health=$BOOT_HS"
                printf 'ng-health: %s\n' "${BOOT_NG:-<unreachable>}"
                printf 'media-readiness: %s\n' "${BOOT_MR:-<unreachable>}"
                break
              fi
              echo "$(date -u +%H:%M:%S) /api/deploy/log not on EC2 yet (old server). bootstrap: gitCommit=${BOOT_GC:-?} expected=${EXPECTED_SHA:0:7} health=${BOOT_HS:-?} — still deploying…"
              sleep 20
              continue
            fi

            echo "$(date -u +%H:%M:%S) status=$STATUS verified=$VERIFIED build=$CHECK_BUILD pm2=$CHECK_PM2 health=$CHECK_HEALTH ngHealth=$CHECK_NGHEALTH deployId=$DEPLOYID pid=$PID"

            case "$STATUS" in
              success)
                if [ "$VERIFIED" = "true" ]; then
                  OUTCOME=success
                else
                  OUTCOME=failed
                  echo "::error::EC2 reported status=success but verification did not pass (verified=$VERIFIED)."
                fi
                echo "=== DEPLOY TERMINAL (status=$STATUS exitCode=$EXITCODE commit=$COMMIT deployId=$DEPLOYID) ==="
                printf '%s\n' "$LAST_VERIFY"
                break ;;
              failed|timeout|unknown)
                OUTCOME="$STATUS"
                echo "::error::Deploy reached terminal non-success state (status=$STATUS exitCode=$EXITCODE)."
                printf '%s\n' "$LAST_VERIFY"
                break ;;
              running|idle)
                : ;;  # still deploying — keep polling
              *)
                echo "::error::DEPLOY_STATUS_CONTRACT_ERROR — unexpected status '$STATUS'."
                printf '%s' "$RESP" | head -c 2000
                echo ""
                OUTCOME=contract_error
                break ;;
            esac
            sleep 20
          done

          # Final outcome enforcement: ONLY success exits 0.
          if [ "$OUTCOME" = "success" ]; then
            echo "Deployment SUCCESSFUL — EC2 status=success and verification checks passed."
            exit 0
          fi
          echo "::error::Deployment did NOT succeed (outcome=$OUTCOME). Last EC2 deploy/verify lines:"
          printf '%s\n' "$LAST_VERIFY"
          if [ "$OUTCOME" = "timeout" ]; then
            echo "::error::No terminal state within 40 min — deploy is INCOMPLETE/UNKNOWN on EC2 (check /tmp/doctarx-deploy.log)."
          fi
          exit 1
